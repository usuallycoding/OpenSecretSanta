server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    # the app's addresses are after the '#', so there is no fallback route
    location / {
        try_files $uri $uri/ =404;
    }

    # nginx has no type for .mjs, and a browser refuses a module script that is not JavaScript
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # nor for .webmanifest, which browsers expect to be served as a manifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # read again on every start of the app, so a new address is picked up at once
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # the notification worker and its helper: a browser must pick up a new version at once
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /push.js {
        add_header Cache-Control "no-cache";
    }
}
