product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core/domain
  - //core/contract
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $ktor.client.core
  - $ktor.client.contentNegotiation
  - $ktor.serialization.kotlinx.json

dependencies@android:
  - $compose.uiTooling
  - $ktor.client.okhttp

dependencies@ios:
  - $ktor.client.darwin

dependencies@wasmJs:
  - $libs.ktor.client.js

settings:
  ktor: enabled
  compose:
    enabled: true
    resources:
      packageName: com.usuallycoding.opensecretsanta.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true

test-dependencies:
  - $ktor.client.mock
  - $libs.kotlinx.coroutines.test

test-dependencies@android:
  - $libs.koin.test
