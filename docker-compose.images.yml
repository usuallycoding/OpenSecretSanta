# The same stack as docker-compose.yml, but only from the images GitHub publishes: there is nothing to build, so it
# works where the repository is not present (a Raspberry Pi, or a Portainer stack pasted into its web editor).
# Every setting comes from the .env file next to this one, or from the stack's environment variables.
#
#   docker compose -f docker-compose.images.yml pull
#   docker compose -f docker-compose.images.yml up -d
#
# SECRETS_DIR is only needed for push notifications: the folder that holds the Firebase service-account key, as a
# full path when the file is not next to the compose file (Portainer runs it from a folder of its own).

services:
  server:
    image: ghcr.io/usuallycoding/opensecretsanta-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # only used while the database has no users yet
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_ORIGIN:-http://localhost:${WEB_PORT:-8080}}
      # optional: the emails sent when a group is drawn
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      # optional: push notifications. FCM_KEY_FILE is the name of the service-account key inside SECRETS_DIR
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_KEY_FILE:+/run/push-secrets/${FCM_KEY_FILE}}
    ports:
      - "${SERVER_PORT:-8081}:8080"
    volumes:
      - data:/data
      # only the server sees the push key, and only for reading; it is in no image
      - ${SECRETS_DIR:-./secrets}:/run/push-secrets:ro

  web:
    image: ghcr.io/usuallycoding/opensecretsanta-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:${SERVER_PORT:-8081}}
      # optional: push notifications in the browser (public settings of the Firebase web app, none of them secret)
      PUBLIC_FIREBASE_API_KEY: ${PUBLIC_FIREBASE_API_KEY:-}
      PUBLIC_FIREBASE_PROJECT_ID: ${PUBLIC_FIREBASE_PROJECT_ID:-}
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      PUBLIC_FIREBASE_APP_ID: ${PUBLIC_FIREBASE_APP_ID:-}
      PUBLIC_FIREBASE_VAPID_KEY: ${PUBLIC_FIREBASE_VAPID_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  data:
